    TARGET_ENV: production
    TARGET_OUTPUT: build-prod
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_REF_PROTECTED == "true" && $ENABLE_PROD == "true"

package-prod:
  stage: production
  dependencies:
    - build-prod
  needs:
    - job: build-prod
  extends: .package
  variables:
    TARGET_ENV: production
    TARGET_OUTPUT: build-prod
    DOCKER_SOURCE_REF: $DEFAULT_DOCKER_SOURCE_REF
    DOCKER_SOURCE_PATH: $DEFAULT_DOCKER_SOURCE_PATH
    DOCKER_SOURCE_FILE: $DEFAULT_DOCKER_SOURCE_FILE
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_REF_PROTECTED == "true" && $ENABLE_PROD == "true"

deploy-production:
  stage: production
  extends: .upgrade
  needs:
    - job: package-prod
  variables:
    AGENT: $PROD_CICD_K8S_AGENT
    TARGET_ENV: production
    TARGET_NAMESPACE: production
    TARGET_HOSTNAME: $DOMAIN.pd.tcw.com
    TLS_HOST_WILD: $TLS_PROD_HOST_WILDCARD
    TLS_HOST_LITERAL: $TLS_PROD_HOST_LITERAL
    TLS_SECRET: $TLS_PROD_SECRET_NAME
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_REF_PROTECTED == "true" && $ENABLE_PROD == "true"

version:
  stage: production
  cache: 
    key: ${CI_COMMIT_REF_SLUG}
    paths: 
      - node_modules/
    policy: push
  extends: .version
  needs:
    - job: deploy-production
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_REF_PROTECTED == "true" && $ENABLE_PROD == "true"
tag:
  stage: production
  extends: .tag
  needs:
    - job: version
      artifacts: true
    - job: deploy-production
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_REF_PROTECTED == "true"
release:
  stage: production
  extends: .release
  needs:
    - job: version
      artifacts: true
    - job: tag
    - job: deploy-production
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_REF_PROTECTED == "true" && $ENABLE_PROD == "true"

